name: e2e
on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: mmuser
          POSTGRES_PASSWORD: mostest
          POSTGRES_DB: mattermost_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      minio:
        image: minio/minio:RELEASE.2024-06-22T05-26-45Z
        env:
          MINIO_ACCESS_KEY: minioaccesskey
          MINIO_SECRET_KEY: miniosecretkey
          MINIO_SSE_MASTER_KEY: "my-minio-key:6368616e676520746869732070617373776f726420746f206120736563726574"

      inbucket:
        image: inbucket/inbucket:latest
        ports:
          - 10080:9000
          - 10025:2500

      mattermost-server:
        image: mattermostdevelopment/mattermost-enterprise-edition:master
        env:
          DB_HOST: postgres
          DB_PORT_NUMBER: 5432
          MM_DBNAME: mattermost_test
          MM_USERNAME: mmuser
          MM_PASSWORD: mostest
          CI_INBUCKET_HOST: inbucket
          CI_INBUCKET_PORT: 10080
          CI_MINIO_HOST: minio
          IS_CI: true
          MM_SERVICEENVIRONMENT: test
          MM_CLUSTERSETTINGS_READONLYCONFIG: false
          MM_EMAILSETTINGS_SMTPSERVER: inbucket
          MM_EMAILSETTINGS_SMTPPORT: 10025
          MM_SQLSETTINGS_DATASOURCE: "postgres://mmuser:mostest@postgres:5432/mattermost_test?sslmode=disable&connect_timeout=10"
          MM_SQLSETTINGS_DRIVERNAME: postgres
          MM_PLUGINSETTINGS_ENABLEUPLOADS: true
          MM_PLUGINSETTINGS_AUTOMATICPREPACKAGEDPLUGINS: false
          MM_SERVICESETTINGS_SITEURL: http://localhost:8065
        ports:
          - 8065:8065

    env:
      MM_SERVICESETTINGS_SITEURL: http://localhost:8065
      MM_ADMIN_USERNAME: sysadmin
      MM_ADMIN_PASSWORD: Sys@dmin-sample1
      MM_ADMIN_EMAIL: sysadmin@sample.mattermost.com

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Create admin user
        run: |
          # Wait for Mattermost to be ready.
          for i in $(seq 1 30); do
            if curl -fs http://localhost:8065/api/v4/system/ping > /dev/null 2>&1; then
              echo "Mattermost is ready"
              break
            fi
            echo "Waiting for Mattermost... ($i/30)"
            sleep 2
          done
          # Create admin user via API.
          STATUSCODE=$(curl -X POST -H "Content-Type: application/json" \
            -d '{"email": "'"${MM_ADMIN_EMAIL}"'", "username": "'"${MM_ADMIN_USERNAME}"'", "password": "'"${MM_ADMIN_PASSWORD}"'"}' \
            ${MM_SERVICESETTINGS_SITEURL}/api/v4/users -w "%{http_code}" -o /dev/stderr)
          if test $STATUSCODE -ne 201; then exit 1; fi

      - name: Build and deploy plugin
        run: |
          MM_ADMIN_TOKEN=$(curl -s -X POST -H "Content-Type: application/json" \
            -d '{"login_id": "'"${MM_ADMIN_USERNAME}"'", "password": "'"${MM_ADMIN_PASSWORD}"'"}' \
            ${MM_SERVICESETTINGS_SITEURL}/api/v4/users/login -i 2>/dev/null \
            | grep -i '^token:' | awk '{print $2}' | tr -d '\r')
          export MM_ADMIN_TOKEN
          make deploy

      - name: Verify plugin status
        run: |
          MM_ADMIN_TOKEN=$(curl -s -X POST -H "Content-Type: application/json" \
            -d '{"login_id": "'"${MM_ADMIN_USERNAME}"'", "password": "'"${MM_ADMIN_PASSWORD}"'"}' \
            ${MM_SERVICESETTINGS_SITEURL}/api/v4/users/login -i 2>/dev/null \
            | grep -i '^token:' | awk '{print $2}' | tr -d '\r')
          echo "=== All plugins ==="
          curl -s -H "Authorization: Bearer $MM_ADMIN_TOKEN" \
            ${MM_SERVICESETTINGS_SITEURL}/api/v4/plugins | python3 -m json.tool
          echo "=== Plugin statuses ==="
          curl -s -H "Authorization: Bearer $MM_ADMIN_TOKEN" \
            ${MM_SERVICESETTINGS_SITEURL}/api/v4/plugins/statuses | python3 -m json.tool
          echo "=== Server logs (last 50 lines) ==="
          curl -s -H "Authorization: Bearer $MM_ADMIN_TOKEN" \
            "${MM_SERVICESETTINGS_SITEURL}/api/v4/logs?per_page=50" | python3 -m json.tool

      - name: Install E2E dependencies
        working-directory: e2e-tests
        run: npm install

      - name: Run E2E tests
        working-directory: e2e-tests
        run: npm run test-ci
        env:
          PW_BASE_URL: ${{ env.MM_SERVICESETTINGS_SITEURL }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e-tests/results
            e2e-tests/test-results
          retention-days: 14
